name: Build Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SmartKey Keyboard v1.0.0
          body: |
            SmartKey Keyboard v1.0.0

            Release build of the SmartKey Keyboard Android input method.

            Features:
            - QWERTY + two symbol keyboards with shift / caps lock
            - Backspace (hold to repeat), enter, space, clipboard memory
            - Emoji keyboard with categories and pages
            - Word suggestions and auto-capitalization (on-device, privacy friendly)
            - Built-in calculator that inserts results into any field
            - Smart tools: quick text, text-case transforms, copy selection
            - 8 themes, haptic feedback and key click sounds
            - Privacy protections: no permissions (except vibration), encrypted
              clipboard memory with auto-clear, opt-in learning, no network use
            - Low-RAM friendly, Android 8 (API 26) and above
          files: |
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true