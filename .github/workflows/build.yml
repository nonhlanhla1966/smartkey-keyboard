name: Build Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verify tests and APK manifest with aapt
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          echo "== Unit test results =="
          ls app/build/test-results/testDebugUnitTest/*.xml
          echo "== Badging =="
          "$BT/aapt" dump badging "$APK" | grep -E "package:|launchable-activity|sdkVersion|targetSdkVersion"
          echo "== Version assertions =="
          "$BT/aapt" dump badging "$APK" > /tmp/badging.txt
          grep -E "package: name='com.smartkey.keyboard' versionCode='5' versionName='1.1.3'" /tmp/badging.txt \
            || { echo "FAIL: expected versionCode 5 / versionName 1.1.3" >&2; exit 1; }
          echo "OK: versionCode 5 / versionName 1.1.3"
          echo "== Launcher diagnostics in dex and resources =="
          unzip -o -q "$APK" classes.dex resources.arsc -d /tmp/apkdex
          if ! strings /tmp/apkdex/classes.dex | grep -q "updateRegistrationStatus"; then
            echo "FAIL: launcher diagnostics (updateRegistrationStatus) missing from dex" >&2
            exit 1
          fi
          echo "OK: updateRegistrationStatus present in dex"
          ( strings /tmp/apkdex/resources.arsc | grep -q "main_diag_registered" ) \
            || ( strings -e l /tmp/apkdex/resources.arsc | grep -q "main_diag_registered" ) \
            || { echo "FAIL: launcher diagnostic strings (main_diag_*) missing from resources" >&2; exit 1; }
          echo "OK: diagnostic resource strings present in resources.arsc"
          ( strings /tmp/apkdex/resources.arsc | grep -q "Version 1.1.3" ) \
            || ( strings -e l /tmp/apkdex/resources.arsc | grep -q "Version 1.1.3" ) \
            || { echo "FAIL: Version 1.1.3 string missing from resources" >&2; exit 1; }
          echo "OK: Version 1.1.3 string present in resources.arsc"
          echo "== Service registration =="
          "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -B1 -A10 "^      E: service " | head -20
          echo "== APK size =="
          ls -l "$APK"
          sha256sum "$APK"

      - name: Verify IME config ships without KeyboardLayoutSet
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/aapt" dump xmltree "$APK" res/xml/method.xml > /tmp/method.txt
          if grep -q "KeyboardLayoutSet" /tmp/method.txt; then
            echo "FAIL: shipped method.xml still contains KeyboardLayoutSet" >&2
            exit 1
          fi
          echo "OK: shipped method.xml has no KeyboardLayoutSet claim"
          for needle in "input-method" "supportsSwitchingToNextInputMethod" "subtype" "imeSubtypeLocale" "languageTag=.*en-US" "android:icon"; do
            if ! grep -Eq "$needle" /tmp/method.txt; then
              echo "FAIL: method.xml missing $needle" >&2
              exit 1
            fi
          done
          echo "OK: method.xml has supportsSwitchingToNextInputMethod, subtype icon, imeSubtypeLocale and languageTag=en-US"
          grep -E "input-method|supportsSwitchingToNextInputMethod|subtype|imeSubtypeLocale|languageTag|icon" /tmp/method.txt

      - name: Verify APK signature is valid
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmartKey Keyboard ${{ github.ref_name }}
          body: |
            SmartKey Keyboard ${{ github.ref_name }}

            Release build of the SmartKey Keyboard Android input method.

            What's new in 1.1.2:
            - IME registration repair: removed the unsupported "KeyboardLayoutSet" subtype
              claim, declared supportsSwitchingToNextInputMethod, added a proper subtype icon
              and language tag so OEM keyboard lists surface SmartKey reliably
            - The SmartKey launcher now shows live Android registration status (registered,
              enabled, or missing) plus a one-tap enable shortcut, so you can verify the IME
              is accepted by Android after installing

            Changes from 1.1.1:
            - Fixed: SmartKey now declares its settings screen (android.ime.settingsactivity),
              so tapping "SmartKey Keyboard" in Android → On-screen keyboard opens the SmartKey
              settings and the keyboard can be enabled and set as default from Settings.

            Changes from 1.1.0:
            - Double-tap space to insert a period (toggleable in settings)
            - Text shortcuts / snippets: type a short code and it expands to full text
              (e.g. "omw" → "on my way"), fully manageable from a new shortcuts screen
            - Emoji keyword search: tap the 🔍 key next to the emoji categories and type
              any query (heart, dog, money…) to pick from live matches
            - Follow-system theme option (auto light/dark), on top of the existing 8 themes

            Features:
            - QWERTY + two symbol keyboards with shift / caps lock and optional number row
            - Backspace (hold to repeat), enter, space, arrow keys, undo / redo / cut / copy / paste
            - Emoji keyboard with category bar, paged navigation and keyword search
            - Word suggestions, autocorrect and auto-capitalization (on-device, privacy friendly)
            - Built-in calculator with parentheses, square root, powers, percent and history
            - Smart tools: date & time insert, offline unit converter, password generator,
              symbols, quick text and text-case transforms
            - Searchable clipboard memory with pin, rename, clear-all and optional PIN lock
            - Autocorrect, suggestions and learning all toggleable; learned words can be wiped
            - 8 themes plus follow-system, key size and one-handed mode, haptic feedback and
              key click sounds
            - Privacy protections: no permissions (except vibration), encrypted storage for
              clipboard memory and shortcuts, no network use, no ads, no tracking
            - Low-RAM friendly, Android 8 (API 26) and above
            - Launcher screen with step-by-step enable instructions and a direct link to
              Android keyboard settings
          files: |
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true